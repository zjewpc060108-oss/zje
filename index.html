<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff5f2"><title>甜蜜幸运转盘</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#fffdfb,#ffe9e6 75%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#633b3b;display:flex;justify-content:center}.app{width:min(100%,480px);min-height:100vh;padding:35px 22px 28px;text-align:center;display:flex;flex-direction:column;align-items:center}.eyebrow{font-size:13px;letter-spacing:3px;color:#d27e7b;margin:5px 0 8px}.title{font-size:30px;margin:0;font-weight:800;color:#a44f59}.subtitle{font-size:14px;color:#b27c7b;margin:9px 0 25px}.wheel-wrap{position:relative;width:min(84vw,350px);aspect-ratio:1;margin:0 auto 24px;filter:drop-shadow(0 12px 20px #cc777733)}canvas{width:100%;height:100%;display:block;border-radius:50%}.pointer{position:absolute;z-index:2;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:35px solid #e46e78;filter:drop-shadow(0 3px 2px #a84d5577)}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:#fffaf5;border:5px solid #f4bbc0;box-shadow:0 2px 8px #bb737744;display:grid;place-items:center;font-size:26px}.spin{border:0;border-radius:999px;padding:15px 58px;background:linear-gradient(135deg,#ef8790,#dc6475);box-shadow:0 7px 16px #dc647544;color:white;font-size:18px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:transform .15s}.spin:active{transform:scale(.97)}.spin:disabled{opacity:.7}.hint{font-size:12px;color:#bd9290;margin:16px 0 22px}.list{width:100%;background:#fffaf7cc;border:1px solid #f7d8d4;border-radius:18px;padding:15px 17px;text-align:left}.list-title{font-size:13px;color:#c27c7c;margin-bottom:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#fff0ec;border-radius:999px;padding:7px 11px;font-size:12px;color:#9c6564}.overlay{position:fixed;inset:0;background:#4a252766;display:none;align-items:center;justify-content:center;padding:25px;z-index:5}.overlay.show{display:flex}.card{width:min(100%,340px);background:#fffaf6;border-radius:26px;padding:30px 22px 25px;box-shadow:0 18px 60px #48252a44;animation:pop .25s ease;text-align:center}.emoji{font-size:58px}.card h2{font-size:17px;color:#bd7777;margin:9px 0}.result{font-size:27px;font-weight:800;color:#a44f59;margin:12px 0 23px}.again{border:0;border-radius:999px;background:#e87883;color:white;padding:12px 34px;font-size:15px;font-weight:700}@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
</style></head><body><main class="app"><div class="eyebrow">A LITTLE SURPRISE FOR YOU</div><h1 class="title">甜蜜幸运转盘</h1><p class="subtitle">转一下，看看今天的甜蜜奖励 💕</p><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" aria-label="幸运转盘"></canvas><div class="hub">💗</div></div><button class="spin" id="spin">开始抽奖</button><p class="hint">心动不如转动 · 每一格都是爱的奖励</p><section class="list"><div class="list-title">转盘里有这些甜蜜惊喜</div><div class="chips" id="chips"></div></section></main><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="emoji">🎉</div><h2>恭喜你抽中</h2><div class="result" id="result"></div><button class="again" id="close">收下这份甜蜜</button></div></div><script>
const prizes=[{name:'一杯奶茶',emoji:'🧋',color:'#f7c9aa'},{name:'一个小甜点',emoji:'🧁',color:'#f8d5dc'},{name:'大餐一份',emoji:'🍽️',color:'#f6e4a8'},{name:'老公亲亲一枚',emoji:'💋',color:'#eeb8c2'},{name:'老公抱抱一个',emoji:'🤗',color:'#c9dfc6'}];
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');let rotation=0,busy=false;const n=prizes.length,step=Math.PI*2/n;
function draw(){const size=canvas.clientWidth||330,dpr=devicePixelRatio||1;canvas.width=size*dpr;canvas.height=size*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const c=size/2,r=size/2-5;for(let i=0;i<n;i++){let a=rotation+i*step-Math.PI/2;ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,a+step);ctx.closePath();ctx.fillStyle=prizes[i].color;ctx.fill();ctx.strokeStyle='#fffaf4';ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.translate(c,c);ctx.rotate(a+step/2);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='23px sans-serif';ctx.fillText(prizes[i].emoji,r*.67,0);ctx.fillStyle='#704b4a';ctx.font='bold 13px sans-serif';ctx.fillText(prizes[i].name,r*.39,0);ctx.restore()}ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.strokeStyle='#fffaf4';ctx.lineWidth=5;ctx.stroke()}
function resize(){draw()}window.addEventListener('resize',resize);prizes.forEach(p=>{let s=document.createElement('span');s.className='chip';s.textContent=p.emoji+' '+p.name;document.getElementById('chips').appendChild(s)});draw();
document.getElementById('spin').onclick=()=>{if(busy)return;busy=true;let button=document.getElementById('spin');button.disabled=true;const winner=Math.floor(Math.random()*n);const target=-Math.PI/2-(winner+.5)*step;let delta=((target-rotation)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);let start=rotation,total=Math.PI*2*6+delta,t0=performance.now(),duration=4400;function frame(now){let t=Math.min(1,(now-t0)/duration),ease=1-Math.pow(1-t,4);rotation=start+total*ease;draw();if(t<1)requestAnimationFrame(frame);else{rotation=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);draw();document.getElementById('emoji').textContent=prizes[winner].emoji;document.getElementById('result').textContent=prizes[winner].name;document.getElementById('overlay').classList.add('show');busy=false;button.disabled=false}}requestAnimationFrame(frame)};document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('show');document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')e.currentTarget.classList.remove('show')};
</script></body></html>
